    <h1>rclone – uso pessoal</h1>
    <p>
      Este é um aplicativo OAuth privado, usado exclusivamente pelo seu próprio
      criador para acessar o próprio Google Drive por meio do
      <a href="https://rclone.org">rclone</a>, em seu computador pessoal.
    </p>
    <p>
      Não é um serviço público, não possui outros usuários e não coleta dados de terceiros.
    </p>
